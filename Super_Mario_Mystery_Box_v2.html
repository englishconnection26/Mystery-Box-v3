<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Box Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Nunito',sans-serif;
  background:linear-gradient(180deg,#5C94FC 0%,#4A7DE4 100%);
  min-height:100vh; overflow-x:hidden; color:#333;
}

/* ── BACKGROUND ── */
.clouds{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.cloud{position:absolute;background:#fff;border-radius:100px;opacity:0.8;}
.cloud::before{content:'';position:absolute;background:#fff;border-radius:100px;}
.cloud1{width:120px;height:40px;top:15%;left:10%;}
.cloud1::before{width:60px;height:60px;top:-30px;left:20px;}
.cloud2{width:100px;height:35px;top:25%;left:70%;}
.cloud2::before{width:50px;height:50px;top:-25px;left:15px;}
.cloud3{width:140px;height:45px;top:10%;left:50%;}
.cloud3::before{width:70px;height:70px;top:-35px;left:30px;}
.cloud4{width:90px;height:30px;top:35%;left:25%;}
.cloud4::before{width:45px;height:45px;top:-20px;left:10px;}
.ground{position:fixed;bottom:0;left:0;width:100%;height:70px;background:linear-gradient(180deg,#6B8C42 0%,#5A7A35 50%,#8B6914 50%,#7A5A10 100%);z-index:1;border-top:4px solid #4A6B2F;}
.ground-pattern{position:absolute;top:50%;left:0;width:100%;height:50%;background-image:repeating-linear-gradient(90deg,transparent,transparent 20px,rgba(0,0,0,0.1) 20px,rgba(0,0,0,0.1) 22px);}

/* ── SOUND ── */
#soundToggle{position:fixed;top:15px;right:15px;z-index:9999;background:rgba(255,255,255,0.95);border:3px solid #FFD700;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.3rem;box-shadow:0 3px 10px rgba(0,0,0,0.2);transition:transform 0.2s;user-select:none;}
#soundToggle:hover{transform:scale(1.1);}

/* ── APP ── */
#app{position:relative;z-index:10;max-width:1100px;margin:0 auto;padding:20px 20px 100px;}

/* ── SETUP ── */
#setupScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;animation:fadeIn 0.5s ease;}
.setup-title{font-family:'Fredoka One',cursive;font-size:3.5rem;color:#FFD700;text-shadow:4px 4px 0 #E6B800,6px 6px 0 rgba(0,0,0,0.3);margin-bottom:6px;text-align:center;}
.setup-subtitle{font-family:'Fredoka One',cursive;font-size:1.8rem;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,0.3);margin-bottom:28px;}
.setup-box{background:rgba(255,255,255,0.97);border-radius:20px;padding:36px;box-shadow:0 10px 40px rgba(0,0,0,0.3);max-width:560px;width:100%;border:4px solid #FFD700;}
.setup-section{margin-bottom:22px;}
.setup-section label{display:block;font-weight:900;font-size:1.05rem;color:#E52521;margin-bottom:8px;}
.setup-section input[type="number"],.setup-section input[type="text"]{width:100%;padding:11px 14px;border:3px solid #FFD700;border-radius:10px;font-size:1rem;font-family:'Nunito',sans-serif;transition:border-color 0.2s;}
.setup-section input:focus{outline:none;border-color:#E52521;}
.team-inputs{display:grid;gap:8px;}
.team-input-row{display:flex;align-items:center;gap:10px;}
.team-color-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;border:2px solid #333;}
.slider-row{display:flex;align-items:center;gap:12px;}
#timerSlider{flex:1;-webkit-appearance:none;height:10px;border-radius:5px;background:#ddd;outline:none;cursor:pointer;}
#timerSlider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#E52521;cursor:pointer;border:3px solid #FFD700;}
#timerSlider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#E52521;cursor:pointer;border:3px solid #FFD700;}
.timer-badge{background:#FFD700;color:#333;padding:5px 14px;border-radius:20px;font-weight:900;font-size:1rem;white-space:nowrap;}

/* ── BUTTONS ── */
.btn{font-family:'Fredoka One',cursive;font-size:1.35rem;padding:14px 36px;border:none;border-radius:50px;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;text-transform:uppercase;letter-spacing:1px;display:inline-block;}
.btn:hover{transform:translateY(-3px);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:0.5;pointer-events:none;}
.btn-red  {background:linear-gradient(180deg,#E52521,#C41E1A);color:#fff;box-shadow:0 5px 0 #9A1815;}
.btn-green{background:linear-gradient(180deg,#43B047,#369639);color:#fff;box-shadow:0 5px 0 #2A782D;}
.btn-yellow{background:linear-gradient(180deg,#FFD700,#E6B800);color:#333;box-shadow:0 5px 0 #C49400;}
.btn-blue {background:linear-gradient(180deg,#5C94FC,#4A7DE4);color:#fff;box-shadow:0 5px 0 #3A5FB0;}
.btn-center{display:block;margin:20px auto 0;}

/* ── GAME SCREEN ── */
#gameScreen{display:none;animation:fadeIn 0.5s ease;}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.game-title{font-family:'Fredoka One',cursive;font-size:2rem;color:#FFD700;text-shadow:3px 3px 0 #E6B800,4px 4px 0 rgba(0,0,0,0.3);}
.turn-indicator{background:rgba(255,255,255,0.97);padding:10px 22px;border-radius:30px;font-weight:900;font-size:1.05rem;border:3px solid #FFD700;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.scoreboard{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;}
.score-card{background:rgba(255,255,255,0.97);border-radius:14px;padding:12px 22px;text-align:center;border:3px solid;min-width:130px;transition:transform 0.3s;}
.score-card.active{transform:scale(1.1);box-shadow:0 0 20px rgba(255,215,0,0.5);}
.score-card h3{font-size:0.85rem;margin-bottom:4px;text-transform:uppercase;}
.score-card .pts{font-family:'Fredoka One',cursive;font-size:1.8rem;}

/* ── BOX GRID ── */
.box-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:0 auto 28px;max-width:880px;}
@media(max-width:700px){.box-grid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:420px){.box-grid{grid-template-columns:repeat(3,1fr);}}
.game-box{aspect-ratio:1;background:linear-gradient(135deg,#FFD700 0%,#FFC800 50%,#E6B800 100%);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:3px solid #E6A800;box-shadow:0 6px 0 #C49400,0 8px 15px rgba(0,0,0,0.3);transition:transform 0.18s,box-shadow 0.18s;font-family:'Fredoka One',cursive;font-size:1.5rem;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,0.3);position:relative;user-select:none;}
.game-box::before{content:'';position:absolute;top:7px;left:7px;right:7px;bottom:7px;border:2px dashed rgba(255,255,255,0.4);border-radius:8px;pointer-events:none;}
.game-box:not(.opened):hover{transform:translateY(-5px) rotate(3deg);box-shadow:0 10px 0 #C49400,0 14px 25px rgba(0,0,0,0.3);}
.game-box:not(.opened):active{transform:translateY(1px);box-shadow:0 3px 0 #C49400;}
.game-box.opened{background:linear-gradient(135deg,#999,#777);border-color:#555;box-shadow:0 3px 0 #444;cursor:default;opacity:0.55;}
.box-num{font-size:1.4rem;font-family:'Fredoka One',cursive;font-weight:900;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,0.3);line-height:1;}
.game-box.opened .box-num{color:rgba(255,255,255,0.6);font-size:1.6rem;}
@keyframes boxBounce{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.2) rotate(-5deg)}50%{transform:scale(0.9) rotate(5deg)}75%{transform:scale(1.1) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
.box-bouncing{animation:boxBounce 0.5s ease;}

/* ── MODAL ── */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.72);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow-y:auto;}
.overlay.show{display:flex;animation:fadeIn 0.25s ease;}
.modal{background:#fff;border-radius:20px;padding:32px;max-width:920px;width:100%;border:5px solid #FFD700;box-shadow:0 20px 60px rgba(0,0,0,0.4);animation:slideUp 0.35s ease;max-height:92vh;overflow-y:auto;overflow-wrap:break-word;word-break:break-word;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-title{font-family:'Fredoka One',cursive;font-size:1.75rem;color:#E52521;}
.timer-display{font-family:'Fredoka One',cursive;font-size:1.5rem;color:#E52521;background:#FFD700;padding:5px 14px;border-radius:20px;min-width:56px;text-align:center;}
.timer-display.urgent{animation:blink 0.5s infinite;color:#fff;background:#E52521;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.45}}

/* ── TYPE BADGE ── */
.type-badge{display:inline-block;padding:4px 15px;border-radius:20px;font-weight:900;font-size:0.98rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px;}
.type-claim  {background:#FFF3CD;color:#856404;border:2px solid #FFDF7E;}
.type-example{background:#D1ECF1;color:#0C5460;border:2px solid #9DD9E3;}
.type-reason {background:#D4EDDA;color:#155724;border:2px solid #8FD19E;}
.type-chance {background:#E8D5F5;color:#5E1B8A;border:2px solid #C897E8;}
.type-quiz   {background:#DCEEFB;color:#0B5394;border:2px solid #9CC7EA;}

/* ── SENTENCE CARD ── */
.sentence-card{background:#F8F9FF;border-radius:14px;padding:20px 22px;margin-bottom:18px;border:2px solid #D0D9F5;}
.sentence-stars{font-size:1.1rem;margin-bottom:8px;color:#888;font-weight:700;}
.sentence-text{font-size:1.6rem;font-weight:700;line-height:1.7;color:#222;overflow-wrap:break-word;word-break:break-word;}
.blank-underline{display:inline-block;min-width:90px;border-bottom:3px solid #5C94FC;margin:0 3px;vertical-align:middle;}

/* ── WORD BANK ── */
.word-bank{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;padding:12px 14px;background:#F4F6FB;border-radius:12px;border:2px dashed #C8D4EE;}
@media(max-width:600px){.word-bank{grid-template-columns:1fr;}}
.word-chip{padding:12px 20px;background:linear-gradient(180deg,#5C94FC,#4A7DE4);color:#fff;border-radius:25px;font-weight:900;font-size:1.25rem;line-height:1.35;border:2px solid #3A5FB0;box-shadow:0 3px 0 #3A5FB0;user-select:none;text-align:left;overflow-wrap:break-word;word-break:break-word;}
.word-chip.answer-chip{cursor:pointer;transition:transform 0.15s,box-shadow 0.15s,background 0.2s;}
.word-chip.answer-chip:hover{transform:translateY(-2px);box-shadow:0 5px 0 #3A5FB0;}
.word-chip.answer-chip:active{transform:translateY(1px);box-shadow:0 2px 0 #3A5FB0;}
.word-chip.chip-wrong{background:linear-gradient(180deg,#E52521,#C41E1A)!important;border-color:#9A1815!important;box-shadow:0 3px 0 #9A1815!important;pointer-events:none;}
.word-chip.chip-right{background:linear-gradient(180deg,#43B047,#369639)!important;border-color:#2A782D!important;box-shadow:0 3px 0 #2A782D!important;}
@keyframes chipShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.word-chip.chip-wrong{animation:chipShake 0.4s ease;}

/* ── KEEP / PASS ── */
.keep-pass-title{font-family:'Fredoka One',cursive;font-size:1.8rem;color:#333;margin-bottom:5px;text-align:center;}
.keep-pass-sub{font-size:1.1rem;color:#666;margin-bottom:14px;font-weight:700;text-align:center;overflow-wrap:break-word;}
.keep-pass-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.give-section{margin-top:16px;}
.give-section h4{font-weight:900;font-size:0.9rem;margin-bottom:8px;color:#555;text-align:center;}
.team-buttons{display:grid;gap:8px;}
.team-pick-btn{padding:16px;border:3px solid;border-radius:12px;cursor:pointer;background:#fff;font-size:1.3rem;font-weight:900;transition:transform 0.15s;font-family:'Nunito',sans-serif;overflow-wrap:break-word;}
.team-pick-btn:hover{transform:scale(1.04);}

/* ── RESULT ── */
#resultOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.78);display:none;align-items:center;justify-content:center;z-index:2000;flex-direction:column;}
#resultOverlay.show{display:flex;animation:fadeIn 0.3s ease;}
.result-coins{position:absolute;width:100%;height:100%;overflow:hidden;pointer-events:none;}
.coin{position:absolute;width:44px;height:44px;background:linear-gradient(180deg,#FFD700,#FFA500);border-radius:50%;border:3px solid #E6A800;display:flex;align-items:center;justify-content:center;font-size:1rem;animation:coinFall 2s ease-in forwards;}
@keyframes coinFall{0%{transform:translateY(-100px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.result-box{background:#fff;border-radius:24px;padding:40px 50px;text-align:center;border:5px solid;box-shadow:0 20px 60px rgba(0,0,0,0.4);z-index:10;animation:bounceIn 0.45s ease;max-width:440px;width:90%;}
@keyframes bounceIn{0%{transform:scale(0.3);opacity:0}55%{transform:scale(1.06)}75%{transform:scale(0.94)}100%{transform:scale(1);opacity:1}}
.result-title{font-family:'Fredoka One',cursive;font-size:2.2rem;margin-bottom:12px;}
.result-points{font-family:'Fredoka One',cursive;font-size:2.6rem;margin-bottom:14px;}
.result-msg{font-size:1.05rem;font-weight:700;}

/* ── GAME OVER ── */
#gameOver{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#5C94FC,#4A7DE4);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:3000;text-align:center;padding:20px;}
#gameOver.show{display:flex;animation:fadeIn 0.5s ease;}
.trophy{font-size:6rem;margin-bottom:18px;animation:trophyBounce 1s ease infinite;}
@keyframes trophyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.winner-name{font-family:'Fredoka One',cursive;font-size:3rem;color:#FFD700;text-shadow:3px 3px 0 #E6B800,5px 5px 0 rgba(0,0,0,0.3);margin-bottom:8px;}
.congrats{color:#FFD700;font-size:1.4rem;font-weight:900;text-shadow:2px 2px 0 rgba(0,0,0,0.3);}
.final-scores{display:flex;gap:16px;margin:26px 0;flex-wrap:wrap;justify-content:center;}
.final-card{background:rgba(255,255,255,0.97);border-radius:14px;padding:18px 26px;text-align:center;border:4px solid;}
.final-card.winner{transform:scale(1.15);box-shadow:0 0 30px rgba(255,215,0,0.6);}
.final-card .medal{font-size:2rem;margin-bottom:4px;}
.final-card .fname{font-weight:900;}
.final-card .fscore{font-family:'Fredoka One',cursive;font-size:1.5rem;}

/* ── MISC ── */
.points-popup{position:fixed;font-family:'Fredoka One',cursive;font-size:2rem;z-index:500;pointer-events:none;animation:ptFloat 1.5s ease forwards;}
@keyframes ptFloat{0%{transform:translateX(-50%) translateY(0) scale(0.5);opacity:0}20%{transform:translateX(-50%) translateY(-20px) scale(1.2);opacity:1}100%{transform:translateX(-50%) translateY(-100px) scale(1);opacity:0}}
.confetti-piece{position:fixed;width:10px;height:10px;top:-10px;z-index:2999;animation:confettiFall 3s linear forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hidden{display:none!important;}
</style>
</head>
<body>

<div class="clouds">
  <div class="cloud cloud1"></div><div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div><div class="cloud cloud4"></div>
</div>
<div class="ground"><div class="ground-pattern"></div></div>
<div id="soundToggle" title="Toggle sound">🔊</div>

<div id="app">

  <!-- SETUP -->
  <div id="setupScreen">
    <div class="setup-title">MYSTERY BOX QUIZ</div>
    <div class="setup-box">
      <div class="setup-section">
        <label>Number of Teams (2–4)</label>
        <input type="number" id="teamCount" min="2" max="4" value="2">
      </div>
      <div class="setup-section">
        <label>Team Names</label>
        <div class="team-inputs" id="teamInputs"></div>
      </div>
      <div class="setup-section">
        <label>Answer Timer (seconds)</label>
        <div class="slider-row">
          <input type="range" id="timerSlider" min="10" max="120" value="30">
          <span class="timer-badge" id="timerBadge">30s</span>
        </div>
      </div>
      <button class="btn btn-red btn-center" id="startBtn">▶ START GAME!</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="gameScreen">
    <div class="game-header">
      <div class="game-title">🎁 MYSTERY BOXES</div>
      <div class="turn-indicator" id="turnIndicator">–</div>
    </div>
    <div class="scoreboard" id="scoreboard"></div>
    <div class="box-grid" id="boxGrid"></div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px;">
      <button class="btn btn-yellow" id="endBtn">END GAME</button>
      <button class="btn btn-blue" id="resetBtn">🔀 RESET &amp; SHUFFLE</button>
    </div>
  </div>

</div>

<!-- KEEP / PASS MODAL -->
<div class="overlay" id="questionOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="qTitle">Box 1</div>
      <div class="timer-display" id="timerDisplay">30</div>
    </div>

    <div id="typeBadge"></div>

    <!-- Sentence + answer options -->
    <div class="sentence-card" id="sentenceCard">
      <div class="sentence-stars" id="qStars"></div>
      <div class="sentence-text" id="qSentence"></div>
    </div>
    <div class="word-bank" id="wordBank"></div>

    <!-- Phase A: students answer, tap the right choice (or host can skip manually) -->
    <div id="answerPhase">
      <div class="keep-pass-sub" style="text-align:center;">Tap the correct answer above!</div>
      <button class="btn btn-yellow btn-center" id="stopAnswerBtn">✋ STOP &amp; PICK WINNER</button>
    </div>

    <!-- Phase B: host picks which team got it right -->
    <div class="hidden" id="winnerSection">
      <div class="keep-pass-title">🏆 Who Got It Right?</div>
      <div class="keep-pass-sub" id="answerHint" style="color:#5E1B8A;">Host selects the winning team:</div>
      <div class="team-buttons" id="winnerButtons"></div>
      <button class="btn btn-red btn-center" id="noWinnerBtn">❌ Nobody Got It</button>
    </div>

    <!-- Phase C: winning team keeps or passes the box -->
    <div class="hidden" id="keepPassSection">
      <div class="keep-pass-title" id="keepPassTitle">🎲 Keep or Pass the Box?</div>
      <div class="keep-pass-sub">Winning team decides — then reveal the points!</div>
      <div class="keep-pass-btns">
        <button class="btn btn-green" id="keepBtn">✅ KEEP BOX</button>
        <button class="btn btn-red"   id="passBtn">🎁 PASS BOX</button>
      </div>
      <div class="give-section hidden" id="giveSection">
        <h4>Choose a team to receive the box:</h4>
        <div class="team-buttons" id="teamButtons"></div>
      </div>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="resultOverlay">
  <div class="result-coins" id="resultCoins"></div>
  <div class="result-box" id="resultBox">
    <div class="result-title"  id="rTitle">LUCKY!</div>
    <div class="result-points" id="rPoints">+300 PTS</div>
    <div class="result-msg"    id="rMsg">Great job!</div>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameOver">
  <div class="trophy">🏆</div>
  <div class="winner-name" id="winnerName">TEAM 1 WINS!</div>
  <div class="congrats">CONGRATULATIONS!</div>
  <div class="final-scores" id="finalScores"></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px;">
    <button class="btn btn-yellow" onclick="location.reload()">🔄 PLAY AGAIN</button>
    <button class="btn btn-blue"   onclick="resetGame()">🔀 RESET &amp; SHUFFLE</button>
  </div>
</div>

<script>
// ══════════════════════════════════════
//  QUESTIONS — Adverbs of Manner: Too & Enough Quiz
//  type: "quiz"
//  stars: "⭐" | "⭐⭐" | "⭐⭐⭐"
//  sentence: the question prompt
//  bank: array of answer choices (shown as chips)
//  answer: correct choice letter (host reference only)
// ══════════════════════════════════════
const QUESTIONS = [
  { box:"1",  type:"quiz", stars:"⭐",
    sentence: "This coffee is ___ hot to drink.",
    bank: ["a) very","b) too","c) so","d) much"],
    answer:"b" },
  { box:"2",  type:"quiz", stars:"⭐",
    sentence: "He isn't old ___ to drive.",
    bank: ["a) too","b) very","c) enough","d) so"],
    answer:"c" },
  { box:"3",  type:"quiz", stars:"⭐",
    sentence: "Which sentence is correct?",
    bank: ["a) She is enough tall.","b) She is tall too.","c) She is tall enough.","d) She is too tall enough."],
    answer:"c" },
  { box:"4",  type:"quiz", stars:"⭐",
    sentence: '"This box is too heavy for me to lift." This means:',

// ══════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════
const COLORS        = ['#E52521','#43B047','#5C94FC','#FFD700'];
const BORDER_COLORS = ['#9A1815','#2A782D','#3A5FB0','#C49400'];
const DEF_NAMES     = ['Team Mario','Team Luigi','Team Peach','Team Toad'];

let teams         = [];
let currentTeam   = 0;
let winningTeam   = null;
let boxesPickable = false;
let timerSecs     = 30;
let timerInterval = null;
let activeBox     = null;
let soundOn       = true;
let currentQ      = null;
let askedQ        = null;

// ── Audio ──
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSound(type) {
  if (!soundOn) return;
  try {
    const ctx = getAudio(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    const t = ctx.currentTime;
    ({
      correct:  () => { osc.type='square';   osc.frequency.setValueAtTime(523,t); osc.frequency.setValueAtTime(659,t+0.1); osc.frequency.setValueAtTime(784,t+0.2); gain.gain.setValueAtTime(0.1,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.4); osc.start(t); osc.stop(t+0.4); },
      wrong:    () => { osc.type='sawtooth'; osc.frequency.setValueAtTime(200,t); osc.frequency.setValueAtTime(150,t+0.2); gain.gain.setValueAtTime(0.1,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.4); osc.start(t); osc.stop(t+0.4); },
      open:     () => { osc.type='square';   osc.frequency.setValueAtTime(300,t); osc.frequency.setValueAtTime(400,t+0.05); osc.frequency.setValueAtTime(500,t+0.1); gain.gain.setValueAtTime(0.1,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.2); osc.start(t); osc.stop(t+0.2); },
      coin:     () => { osc.type='sine';     osc.frequency.setValueAtTime(880,t); gain.gain.setValueAtTime(0.1,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.15); osc.start(t); osc.stop(t+0.15); },
      surprise: () => { osc.type='square';   osc.frequency.setValueAtTime(440,t); osc.frequency.setValueAtTime(330,t+0.1); osc.frequency.setValueAtTime(220,t+0.2); gain.gain.setValueAtTime(0.1,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.3); osc.start(t); osc.stop(t+0.3); }
    }[type] || (() => {}))();
  } catch(e) {}
}

// ══════════════════════════════════════
//  SETUP
// ══════════════════════════════════════
function buildTeamInputs() {
  const n = Math.min(4, Math.max(2, parseInt(document.getElementById('teamCount').value) || 2));
  const div = document.getElementById('teamInputs');
  div.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const row = document.createElement('div');
    row.className = 'team-input-row';
    row.innerHTML = `<div class="team-color-dot" style="background:${COLORS[i]}"></div>
      <input type="text" id="tname${i}" value="${DEF_NAMES[i]}" placeholder="Team ${i+1} Name">`;
    div.appendChild(row);
  }
}
function updateTimerBadge() {
  document.getElementById('timerBadge').textContent = document.getElementById('timerSlider').value + 's';
}
function startGame() {
  getAudio();
  const n = Math.min(4, Math.max(2, parseInt(document.getElementById('teamCount').value) || 2));
  timerSecs = parseInt(document.getElementById('timerSlider').value) || 30;
  teams = [];
  for (let i = 0; i < n; i++) {
    const el = document.getElementById('tname' + i);
    teams.push({ name: el ? el.value.trim() || DEF_NAMES[i] : DEF_NAMES[i], score:0, color:COLORS[i], border:BORDER_COLORS[i] });
  }
  currentTeam = 0;
  QUESTIONS.forEach(q => { q.opened = false; q.asked = false; });
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display  = 'block';
  renderScoreboard(); renderBoxGrid(); nextRound();
}

// ══════════════════════════════════════
//  SCOREBOARD & TURN
// ══════════════════════════════════════
function renderScoreboard() {
  document.getElementById('scoreboard').innerHTML = teams.map((t,i) => `
    <div class="score-card ${i===currentTeam?'active':''}" style="border-color:${t.border}">
      <h3 style="color:${t.color}">${t.name}</h3>
      <div class="pts" style="color:${t.color}">${t.score}</div>
    </div>`).join('');
}
function updateTurnBadge() {
  const t = teams[currentTeam];
  const el = document.getElementById('turnIndicator');
  el.innerHTML = `🎮 <span style="color:${t.color}">${t.name}</span>'s Turn!`;
  el.style.borderColor = t.color;
  el.style.background  = `linear-gradient(135deg,#fff,${t.color}20)`;
  document.querySelectorAll('.score-card').forEach((c,i) => c.classList.toggle('active', i===currentTeam));
}

// ══════════════════════════════════════
//  BOX GRID
// ══════════════════════════════════════
function renderBoxGrid() {
  const grid = document.getElementById('boxGrid');
  grid.innerHTML = QUESTIONS.map((q,i) => `
    <div class="game-box ${q.opened?'opened':''}" id="box_${q.box}" data-box="${q.box}">
      <span class="box-num">${q.opened?'✓':q.box}</span>
    </div>`).join('');
  grid.querySelectorAll('.game-box:not(.opened)').forEach(el =>
    el.addEventListener('click', () => clickBox(el.dataset.box))
  );
}
function clickBox(label) {
  if (!boxesPickable) return;
  const q = QUESTIONS.find(x => x.box === label);
  if (!q || q.opened) return;
  boxesPickable = false;
  activeBox = label;
  playSound('open');
  const el = document.getElementById('box_' + label);
  el.classList.add('box-bouncing');
  setTimeout(() => { el.classList.remove('box-bouncing'); openBoxKeepPass(q); }, 500);
}

// ══════════════════════════════════════
//  PRE-BOX: RANDOM QUESTION FOR STUDENTS
// ══════════════════════════════════════
function askRandomQuestion() {
  const available = QUESTIONS.filter(q => !q.asked);
  if (available.length === 0) { promptPickBox(); return; }
  const q = available[Math.floor(Math.random() * available.length)];
  q.asked = true;
  askedQ = q;

  updateTurnBadge();

  // Title (box-agnostic during the pre-box question)
  document.getElementById('qTitle').textContent = '';

  // Type badge
  const typeLabels = { claim:'💬 Claim', example:'🌿 Example', reason:'❤️ Reason', quiz:'📝 Quiz' };
  const typeCls    = { claim:'type-claim', example:'type-example', reason:'type-reason', quiz:'type-quiz' };
  document.getElementById('typeBadge').innerHTML =
    `<span class="type-badge ${typeCls[q.type] || 'type-chance'}">${typeLabels[q.type] || '🎲 Chance'}</span>`;

  // Stars + sentence
  document.getElementById('sentenceCard').classList.remove('hidden');
  document.getElementById('qStars').textContent = q.stars || '';
  document.getElementById('qSentence').textContent = q.sentence || '';

  // Answer options — clickable; correct choice advances to team pick
  const wbDiv = document.getElementById('wordBank');
  if (q.bank && q.bank.length) {
    wbDiv.classList.remove('hidden');
    wbDiv.innerHTML = q.bank.map((w,i) => `<span class="word-chip answer-chip" data-idx="${i}">${w}</span>`).join('');
    wbDiv.querySelectorAll('.answer-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const idx    = parseInt(chip.dataset.idx);
        const letter = (q.bank[idx].trim()[0] || '').toLowerCase();
        if (q.answer && letter === q.answer.toLowerCase()) {
          playSound('correct');
          chip.classList.add('chip-right');
          wbDiv.querySelectorAll('.answer-chip').forEach(c => c.style.pointerEvents = 'none');
          setTimeout(() => showWinnerSelection(), 500);
        } else {
          playSound('wrong');
          chip.classList.add('chip-wrong');
          setTimeout(() => chip.classList.remove('chip-wrong'), 3000);
        }
      });
    });
  } else {
    wbDiv.classList.add('hidden');
  }

  // Reset phase sections
  winningTeam = null;
  document.getElementById('answerPhase').classList.remove('hidden');
  document.getElementById('winnerSection').classList.add('hidden');
  document.getElementById('keepPassSection').classList.add('hidden');
  document.getElementById('giveSection').classList.add('hidden');

  // Timer
  document.getElementById('timerDisplay').style.display = '';
  document.getElementById('timerDisplay').classList.remove('urgent');

  showOverlay('questionOverlay');
  startTimer();
}

// ══════════════════════════════════════
//  BOX PICKED → straight to Keep/Pass
// ══════════════════════════════════════
function openBoxKeepPass(q) {
  currentQ = q;
  document.getElementById('sentenceCard').classList.add('hidden');
  document.getElementById('wordBank').classList.add('hidden');
  document.getElementById('typeBadge').innerHTML = '';
  document.getElementById('qTitle').textContent = '🎁 Box ' + q.box;
  document.getElementById('answerPhase').classList.add('hidden');
  document.getElementById('winnerSection').classList.add('hidden');
  document.getElementById('timerDisplay').style.display = 'none';
  showKeepPass();
  showOverlay('questionOverlay');
}

// ══════════════════════════════════════
//  PHASE B: HOST PICKS THE WINNING TEAM
// ══════════════════════════════════════
document.getElementById('stopAnswerBtn').addEventListener('click', showWinnerSelection);

function showWinnerSelection() {
  clearInterval(timerInterval);
  document.getElementById('timerDisplay').style.display = 'none';
  document.getElementById('answerPhase').classList.add('hidden');
  document.getElementById('winnerSection').classList.remove('hidden');

  const hint = document.getElementById('answerHint');
  if (askedQ && askedQ.answer && askedQ.bank) {
    const correctOpt = askedQ.bank.find(o => o.toLowerCase().startsWith(askedQ.answer + ')'));
    hint.textContent = correctOpt ? `✅ Correct answer: ${correctOpt}` : 'Host selects the winning team:';
  } else {
    hint.textContent = 'Host selects the winning team:';
  }

  const btns = document.getElementById('winnerButtons');
  btns.innerHTML = teams.map((t,i) => `
    <button class="team-pick-btn" data-i="${i}" style="border-color:${t.border};color:${t.color}">${t.name}</button>`
  ).join('');
  btns.querySelectorAll('.team-pick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      winningTeam = parseInt(btn.dataset.i);
      hideOverlay('questionOverlay');
      promptPickBox();
    });
  });
}

document.getElementById('noWinnerBtn').addEventListener('click', function() {
  hideOverlay('questionOverlay');
  playSound('wrong');
  showResult("❌ NO WINNER", '0 PTS', 'Nobody got it right — next question!', '#E52521');
  setTimeout(() => { hideResult(); advanceTurn(); nextRound(); }, 2200);
});

function promptPickBox() {
  boxesPickable = true;
  const t = teams[winningTeam];
  const el = document.getElementById('turnIndicator');
  el.innerHTML = `🎁 <span style="color:${t.color}">${t.name}</span>: pick a box!`;
  el.style.borderColor = t.color;
  el.style.background  = `linear-gradient(135deg,#fff,${t.color}20)`;
}

function showKeepPass() {
  document.getElementById('winnerSection').classList.add('hidden');
  document.getElementById('keepPassSection').classList.remove('hidden');
  document.getElementById('keepPassTitle').innerHTML =
    `🎲 <span style="color:${teams[winningTeam].color}">${teams[winningTeam].name}</span> — Keep or Pass the Box?`;
}

// ══════════════════════════════════════
//  PHASE C: KEEP / PASS LOGIC
// ══════════════════════════════════════
document.getElementById('keepBtn').addEventListener('click', function() {
  hideOverlay('questionOverlay');
  const isGood = Math.random() > 0.5;
  const pts    = (Math.floor(Math.random()*46)*10 + 50) * (isGood ? 1 : -1);
  resolvePoints(winningTeam, pts, isGood,
    isGood ? '🎉 LUCKY!' : '💥 OH NO!',
    isGood ? teams[winningTeam].name + ' kept the box and scored!' : teams[winningTeam].name + ' kept it — bad luck!');
});

document.getElementById('passBtn').addEventListener('click', function() {
  const sec  = document.getElementById('giveSection');
  const btns = document.getElementById('teamButtons');
  btns.innerHTML = teams.map((t,i) => i===winningTeam ? '' : `
    <button class="team-pick-btn" data-i="${i}" style="border-color:${t.border};color:${t.color}">${t.name}</button>`
  ).join('');
  btns.querySelectorAll('.team-pick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      hideOverlay('questionOverlay');
      const idx    = parseInt(btn.dataset.i);
      const isGood = Math.random() > 0.5;
      const pts    = (Math.floor(Math.random()*46)*10 + 50) * (isGood ? 1 : -1);
      resolvePoints(idx, pts, isGood,
        isGood ? '🎁 GIFT OPENED!' : '💣 TRAP!',
        isGood ? teams[idx].name + ' received the box — lucky!' : teams[idx].name + ' received the box — it was a trap!');
    });
  });
  sec.classList.remove('hidden');
});

function resolvePoints(teamIdx, pts, isGood, title, msg) {
  teams[teamIdx].score += pts;
  playSound(isGood ? 'coin' : 'surprise');
  floatPoints((pts>0?'+':'')+pts, COLORS[teamIdx]);
  markOpened();
  renderScoreboard();
  if (isGood) spawnCoins();
  showResult(title, (pts>0?'+':'')+pts+' PTS', msg, isGood?'#43B047':'#E52521');
  scheduleNext(2600);
}

// ══════════════════════════════════════
//  TIMER
// ══════════════════════════════════════
function startTimer() {
  clearInterval(timerInterval);
  let t = timerSecs;
  const disp = document.getElementById('timerDisplay');
  disp.textContent = t;
  disp.classList.remove('urgent');
  timerInterval = setInterval(() => {
    t--;
    disp.textContent = t;
    if (t <= 5) disp.classList.add('urgent');
    if (t <= 0) { clearInterval(timerInterval); timeUp(); }
  }, 1000);
}
function timeUp() {
  playSound('wrong');
  showWinnerSelection();
}

// ══════════════════════════════════════
//  RESULT FLASH
// ══════════════════════════════════════
function showResult(title, pts, msg, color) {
  document.getElementById('rTitle').textContent  = title;
  document.getElementById('rTitle').style.color  = color;
  document.getElementById('rPoints').textContent = pts;
  document.getElementById('rPoints').style.color = color;
  document.getElementById('rMsg').textContent    = msg;
  document.getElementById('resultBox').style.borderColor = color;
  document.getElementById('resultOverlay').classList.add('show');
}
function hideResult() {
  document.getElementById('resultOverlay').classList.remove('show');
  document.getElementById('resultCoins').innerHTML = '';
}
function spawnCoins() {
  const c = document.getElementById('resultCoins');
  c.innerHTML = '';
  for (let i=0;i<15;i++) {
    const el = document.createElement('div');
    el.className='coin'; el.textContent='⭐';
    el.style.left=Math.random()*100+'%';
    el.style.animationDelay=Math.random()+'s';
    el.style.animationDuration=(1.5+Math.random())+'s';
    c.appendChild(el);
  }
}

// ══════════════════════════════════════
//  FLOW HELPERS
// ══════════════════════════════════════
function markOpened() {
  const q = QUESTIONS.find(x => x.box === activeBox);
  if (q) {
    q.opened = true;
    const el = document.getElementById('box_' + activeBox);
    if (el) { el.classList.add('opened'); el.querySelector('.box-num').textContent = '✓'; }
  }
  activeBox = null;
}
function scheduleNext(delay) {
  setTimeout(() => { hideResult(); advanceTurn(); nextRound(); }, delay);
}
function advanceTurn() {
  currentTeam = (currentTeam + 1) % teams.length;
}
function nextRound() {
  if (QUESTIONS.every(q => q.opened)) { endGame(); return; }
  askRandomQuestion();
}
function floatPoints(text, color) {
  const el = document.createElement('div');
  el.className='points-popup'; el.textContent=text;
  el.style.color=color; el.style.left='50%'; el.style.top='38%';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

// ══════════════════════════════════════
//  SHUFFLE / RESET / END
// ══════════════════════════════════════
function shuffleArray(arr) {
  for (let i=arr.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function resetGame() {
  clearInterval(timerInterval);
  hideOverlay('questionOverlay');
  hideResult();
  document.getElementById('gameOver').classList.remove('show');
  teams.forEach(t => t.score=0);
  currentTeam=0; winningTeam=null; boxesPickable=false; activeBox=null; currentQ=null; askedQ=null;
  shuffleArray(QUESTIONS);
  QUESTIONS.forEach(q => { q.opened=false; q.asked=false; });
  renderScoreboard(); renderBoxGrid(); nextRound();
}
function endGame() {
  const max = Math.max(...teams.map(t=>t.score));
  const winners = teams.filter(t=>t.score===max);
  document.getElementById('winnerName').textContent = winners.length===1 ? winners[0].name+' WINS!' : "IT'S A TIE!";
  document.getElementById('winnerName').style.color = winners.length===1 ? winners[0].color : '#FFD700';
  const sorted = [...teams].sort((a,b)=>b.score-a.score);
  const medals = ['🥇','🥈','🥉','4️⃣'];
  document.getElementById('finalScores').innerHTML = sorted.map((t,i) => `
    <div class="final-card ${t.score===max?'winner':''}" style="border-color:${t.border}">
      <div class="medal">${medals[i]}</div>
      <div class="fname" style="color:${t.color}">${t.name}</div>
      <div class="fscore" style="color:${t.color}">${t.score}</div>
    </div>`).join('');
  spawnConfetti(); playSound('correct');
  document.getElementById('gameOver').classList.add('show');
}
function spawnConfetti() {
  const cols=['#E52521','#43B047','#5C94FC','#FFD700','#FF6B35','#9C27B0'];
  for (let i=0;i<50;i++) {
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.left=Math.random()*100+'%';
    el.style.background=cols[Math.floor(Math.random()*cols.length)];
    el.style.animationDelay=Math.random()*2+'s';
    el.style.borderRadius=Math.random()>0.5?'50%':'2px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3200);
  }
}
function showOverlay(id){document.getElementById(id).classList.add('show');}
function hideOverlay(id){document.getElementById(id).classList.remove('show');}

// ── Wire up ──
document.getElementById('soundToggle').addEventListener('click',function(){soundOn=!soundOn;this.textContent=soundOn?'🔊':'🔇';});
document.getElementById('teamCount').addEventListener('change',buildTeamInputs);
document.getElementById('timerSlider').addEventListener('input',updateTimerBadge);
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('endBtn').addEventListener('click',endGame);
document.getElementById('resetBtn').addEventListener('click',resetGame);

// Init
QUESTIONS.forEach(q=>{q.opened=false;q.asked=false;});
buildTeamInputs();
updateTimerBadge();
</script>
